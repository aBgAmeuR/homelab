---
- name: Require a compose project path
  ansible.builtin.assert:
    that:
      - compose_project_src | length > 0
      - compose_project_dest | length > 0
    fail_msg: Set compose_project_src and compose_project_dest in group_vars.

- name: Create the compose project directory
  ansible.builtin.file:
    path: "{{ compose_project_dest }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Create data directories with image UIDs
  ansible.builtin.file:
    path: "{{ compose_data_dir }}/{{ item.key }}"
    state: directory
    owner: "{{ item.value }}"
    group: "{{ item.value }}"
    mode: "0750"
  loop: "{{ compose_data_owners | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: compose_data_dir | length > 0

- name: Fingerprint the compose project before the sync
  ansible.builtin.command:
    cmd: find . -type f -exec sha256sum {} +
    chdir: "{{ compose_project_dest }}"
  register: compose_files_before
  changed_when: false
  check_mode: false

- name: Sync the compose project from the repo
  ansible.builtin.copy:
    src: "{{ compose_project_src }}/"
    dest: "{{ compose_project_dest }}/"
    owner: root
    group: root
    mode: "0644"
    directory_mode: "0755"
  notify: Reconcile compose stack

- name: Remove example secret files from the guest
  ansible.builtin.file:
    path: "{{ compose_project_dest }}/{{ item }}"
    state: absent
  loop: "{{ compose_remove_files }}"

- name: Create the directories of the compose templates
  ansible.builtin.file:
    path: "{{ compose_project_dest }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ compose_templates | map(attribute='dest') | map('dirname') | select | unique }}"

- name: Install compose secret and overlay files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ compose_project_dest }}/{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop: "{{ compose_templates }}"
  loop_control:
    label: "{{ item.dest }}"
  notify: Reconcile compose stack

- name: Fingerprint the compose project after the sync
  ansible.builtin.command:
    cmd: find . -type f -exec sha256sum {} +
    chdir: "{{ compose_project_dest }}"
  register: compose_files_after
  changed_when: false
  check_mode: false

- name: Read the bind mounts of each service
  ansible.builtin.command:
    cmd: docker compose config --format json
    chdir: "{{ compose_project_dest }}"
  register: compose_config
  changed_when: false
  check_mode: false

- name: Find services that mount a changed file
  ansible.builtin.set_fact:
    compose_restart_services: >-
      {%- set changed = compose_files_after.stdout_lines
            | difference(compose_files_before.stdout_lines)
            | map('regex_replace', '^\\S+\\s+\\./', compose_project_dest ~ '/')
            | list -%}
      {%- set services = [] -%}
      {%- for name, service in (compose_config.stdout | from_json).services.items() -%}
      {%- for volume in service.volumes | default([]) if volume.type == 'bind' -%}
      {%- for path in changed if path == volume.source or path.startswith(volume.source ~ '/') -%}
      {%- if name not in services -%}{%- set _ = services.append(name) -%}{%- endif -%}
      {%- endfor -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ services | sort }}

- name: Start the compose project
  ansible.builtin.command:
    cmd: docker compose up --detach --remove-orphans
    chdir: "{{ compose_project_dest }}"
  register: compose_up
  changed_when: >-
    'Started' in compose_up.stderr
    or 'Created' in compose_up.stderr
    or 'Recreated' in compose_up.stderr

- name: Apply pending compose reconciles
  ansible.builtin.meta: flush_handlers

- name: Restart services whose mounted files changed
  ansible.builtin.command:
    cmd: docker compose restart {{ compose_restart_services | join(' ') }}
    chdir: "{{ compose_project_dest }}"
  changed_when: true
  when: compose_restart_services | length > 0

- name: Wait until the compose health endpoint answers
  ansible.builtin.uri:
    url: "{{ compose_health_url }}"
    status_code: 200
  register: compose_health
  retries: "{{ compose_health_retries }}"
  delay: "{{ compose_health_delay }}"
  until: compose_health.status == 200
  when: compose_health_url | length > 0
