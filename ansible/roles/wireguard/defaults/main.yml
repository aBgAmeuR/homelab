---
wireguard_interface: wg0
wireguard_port: 16082
wireguard_address: 10.0.0.1/24
wireguard_network: 10.0.0.0/24
wireguard_wan_interface: eth0

# One entry per client: { name, address, public_key }. address is the
# client's tunnel IP, without prefix.
wireguard_peers: []

wireguard_metrics_dir: "{{ alloy_textfile_dir | default('/var/lib/prometheus/node-exporter') }}"
wireguard_metrics_interval: 15s
