---
- name: Require lldap secrets
  ansible.builtin.assert:
    that:
      - auth_lldap_jwt_secret is defined
      - auth_lldap_jwt_secret | length > 0
      - auth_lldap_jwt_secret != "CHANGE_ME"
      - auth_lldap_key_seed is defined
      - auth_lldap_key_seed | length > 0
      - auth_lldap_key_seed != "CHANGE_ME"
      - auth_lldap_admin_password is defined
      - auth_lldap_admin_password | length >= 8
      - auth_lldap_admin_password != "CHANGE_ME"
      - auth_lldap_bind_password is defined
      - auth_lldap_bind_password | length >= 8
      - auth_lldap_bind_password != "CHANGE_ME"
    fail_msg: >-
      Set auth_lldap_jwt_secret, auth_lldap_key_seed, auth_lldap_admin_password
      and auth_lldap_bind_password in inventory/group_vars/identity_servers.sops.yml.

- name: Create the lldap system user
  ansible.builtin.user:
    name: "{{ lldap_user }}"
    system: true
    home: "{{ lldap_data_dir }}"
    shell: /usr/sbin/nologin
    create_home: false

- name: Create lldap directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ lldap_cache | dirname }}"
      owner: root
      group: root
      mode: "0750"
    - path: "{{ lldap_install_dir | dirname }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ lldap_install_dir }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ lldap_data_dir }}"
      owner: "{{ lldap_user }}"
      group: "{{ lldap_user }}"
      mode: "0700"
  loop_control:
    label: "{{ item.path }}"

- name: Download pinned lldap release
  ansible.builtin.get_url:
    url: "{{ lldap_download_url }}"
    dest: "{{ lldap_cache }}"
    checksum: "{{ lldap_checksum }}"
    mode: "0640"
    owner: root
    group: root

- name: Extract lldap
  ansible.builtin.unarchive:
    src: "{{ lldap_cache }}"
    dest: "{{ lldap_install_dir }}"
    remote_src: true
    extra_opts:
      - --strip-components=1
    creates: "{{ lldap_install_dir }}/app"
    owner: root
    group: root
  notify: Restart lldap

- name: Install lldap binaries
  ansible.builtin.copy:
    src: "{{ lldap_install_dir }}/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  loop:
    - lldap
    - lldap_set_password
  notify: Restart lldap

- name: Install lldap configuration
  ansible.builtin.template:
    src: lldap.toml.j2
    dest: "{{ lldap_config }}"
    owner: "{{ lldap_user }}"
    group: "{{ lldap_user }}"
    mode: "0640"
  notify: Restart lldap

- name: Install lldap environment file
  ansible.builtin.template:
    src: lldap.env.j2
    dest: "{{ lldap_env_file }}"
    owner: root
    group: "{{ lldap_user }}"
    mode: "0640"
  notify: Restart lldap

- name: Install lldap systemd unit
  ansible.builtin.template:
    src: lldap.service.j2
    dest: /etc/systemd/system/lldap.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart lldap

- name: Enable and start lldap
  ansible.builtin.systemd:
    name: lldap
    enabled: true
    state: started
    daemon_reload: true

- name: Apply pending lldap restarts
  ansible.builtin.meta: flush_handlers

- name: Wait until lldap HTTP answers on localhost
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ lldap_http_port }}/"
    status_code: [200, 301, 302]
  register: lldap_http
  retries: 30
  delay: 2
  until: lldap_http.status | default(0) in [200, 301, 302]

- name: Bootstrap lldap groups and the TinyAuth bind user
  ansible.builtin.include_tasks: bootstrap.yml
