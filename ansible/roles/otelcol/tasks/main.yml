---
- name: Require at least one journald unit
  ansible.builtin.assert:
    that:
      - otelcol_journald_units | length > 0
    fail_msg: Set otelcol_journald_units for this host or group.

- name: Create the otelcol download cache
  ansible.builtin.file:
    path: "{{ otelcol_cache | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Download pinned otelcol-contrib package
  ansible.builtin.get_url:
    url: "{{ otelcol_download_url }}"
    dest: "{{ otelcol_cache }}"
    checksum: "{{ otelcol_checksum }}"
    mode: "0640"
    owner: root
    group: root

- name: Install otelcol-contrib
  ansible.builtin.apt:
    deb: "{{ otelcol_cache }}"
  notify: Restart otelcol

# journalctl runs as the collector user and needs to read the persistent journal.
- name: Let the collector read the journal
  ansible.builtin.user:
    name: "{{ otelcol_user }}"
    groups: systemd-journal
    append: true
  notify: Restart otelcol

- name: Install the otelcol configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ otelcol_config }}"
    owner: root
    group: "{{ otelcol_user }}"
    mode: "0640"
    validate: /usr/bin/otelcol-contrib validate --config=%s
  notify: Restart otelcol

- name: Enable and start otelcol
  ansible.builtin.systemd:
    name: otelcol-contrib
    enabled: true
    state: started

- name: Apply pending otelcol restarts
  ansible.builtin.meta: flush_handlers
