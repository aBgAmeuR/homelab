---
auth_lldap_version: "v0.6.3"
auth_lldap_download_url: "https://github.com/lldap/lldap/releases/download/{{ auth_lldap_version }}/amd64-lldap.tar.gz"
auth_lldap_checksum: "sha256:e80b50ef39be61de9f1d75182b1e1fa5d82c672261c7e34fd8ffec5455ed3883"
auth_lldap_install_dir: "/opt/lldap/{{ auth_lldap_version }}"
auth_lldap_cache: /var/cache/auth/amd64-lldap.tar.gz
auth_lldap_binary: /usr/local/bin/lldap
auth_lldap_set_password_binary: /usr/local/bin/lldap_set_password
auth_lldap_config: /etc/lldap.toml
auth_lldap_env_file: /etc/lldap.env
auth_lldap_data_dir: /var/lib/lldap
auth_lldap_user: lldap
auth_lldap_http_port: 17170
auth_lldap_ldap_port: 3890
auth_lldap_base_dn: dc=antoinejosset,dc=fr
auth_lldap_admin_user: admin
auth_lldap_admin_email: admin@antoinejosset.fr
auth_lldap_bind_user: tinyauth
auth_lldap_bind_email: tinyauth@antoinejosset.fr
auth_lldap_bind_dn: "uid={{ auth_lldap_bind_user }},ou=people,{{ auth_lldap_base_dn }}"

auth_tinyauth_version: "v5.1.3"
auth_tinyauth_download_url: "https://github.com/tinyauthapp/tinyauth/releases/download/{{ auth_tinyauth_version }}/tinyauth-amd64"
auth_tinyauth_checksum: "sha256:812068e7415ac5f6f7a2a939fdf94d0b70521b890c00de765f253ea1496d042a"
auth_tinyauth_binary: /usr/local/bin/tinyauth
auth_tinyauth_env_file: /etc/tinyauth.env
auth_tinyauth_data_dir: /var/lib/tinyauth
auth_tinyauth_user: tinyauth
auth_tinyauth_port: 3000
auth_tinyauth_app_url: https://auth.antoinejosset.fr
auth_tinyauth_trusted_proxies: "192.168.1.113"
auth_tinyauth_oidc_redirect_uri: https://monitoring.antoinejosset.fr/login/generic_oauth
auth_tinyauth_oidc_client_name: grafana
