---
dnsmasq_config: /etc/dnsmasq.d/lab.conf
dnsmasq_dns_port: 5353
dnsmasq_domain: lan
dnsmasq_interface: eth0

# Two DHCP servers on one LAN hand out conflicting leases.
dnsmasq_dhcp_enabled: false
dnsmasq_dhcp_range_start: 192.168.1.20
dnsmasq_dhcp_range_end: 192.168.1.100
dnsmasq_dhcp_lease_time: 12h
dnsmasq_dhcp_router: 192.168.1.1
dnsmasq_dhcp_dns_servers: []

dnsmasq_lease_file: /var/lib/misc/dnsmasq.leases
dnsmasq_metrics_dir: "{{ alloy_textfile_dir | default('/var/lib/prometheus/node-exporter') }}"
dnsmasq_metrics_interval: 30s
