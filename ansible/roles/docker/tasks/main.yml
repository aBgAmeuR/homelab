---
- name: Create the APT keyring directory
  ansible.builtin.file:
    path: "{{ docker_keyring | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the Docker APT key
  ansible.builtin.get_url:
    url: "{{ docker_gpg_url }}"
    dest: "{{ docker_keyring }}"
    owner: root
    group: root
    mode: "0644"

- name: Add the Docker APT repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_architecture }} signed-by={{ docker_keyring }}]
      {{ docker_repository_url }} {{ ansible_distribution_release }} stable
    filename: docker
    state: present

- name: Install Docker Engine and the Compose plugin
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true

- name: Configure the Docker daemon
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker

- name: Enable and start Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
