---
- name: Require the guest labels
  ansible.builtin.assert:
    that:
      - alloy_instance | length > 0
      - alloy_node or alloy_vmid | string | length > 0
    fail_msg: Set vmid for this host in inventory/hosts.yml.

- name: Remove the agents Alloy replaces
  ansible.builtin.apt:
    name: "{{ alloy_legacy_packages }}"
    state: absent
    purge: true

- name: Remove what the replaced agents left behind
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ alloy_legacy_paths }}"

- name: Create the Alloy download cache
  ansible.builtin.file:
    path: "{{ alloy_cache | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Download pinned Alloy package
  ansible.builtin.get_url:
    url: "{{ alloy_download_url }}"
    dest: "{{ alloy_cache }}"
    checksum: "{{ alloy_checksum }}"
    mode: "0640"
    owner: root
    group: root

- name: Install Alloy
  ansible.builtin.apt:
    deb: "{{ alloy_cache }}"
  notify: Restart alloy

- name: Create the textfile collector directory
  ansible.builtin.file:
    path: "{{ alloy_textfile_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Refresh the package lists every day
  ansible.builtin.copy:
    content: |
      APT::Periodic::Update-Package-Lists "1";
    dest: /etc/apt/apt.conf.d/10periodic
    owner: root
    group: root
    mode: "0644"

- name: Install the apt metrics script
  ansible.builtin.copy:
    src: apt-metrics
    dest: /usr/local/bin/apt-metrics
    owner: root
    group: root
    mode: "0755"

- name: Install the apt metrics units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - apt-metrics.service
    - apt-metrics.timer
  notify: Restart apt metrics timer

- name: Enable and start the apt metrics timer
  ansible.builtin.systemd:
    name: apt-metrics.timer
    enabled: true
    state: started
    daemon_reload: true

# The package already adds the user to adm and systemd-journal.
- name: Let Alloy read container logs
  ansible.builtin.user:
    name: "{{ alloy_user }}"
    groups: docker
    append: true
  when: alloy_docker
  notify: Restart alloy

- name: Install the container metrics script
  ansible.builtin.copy:
    src: docker-metrics
    dest: /usr/local/bin/docker-metrics
    owner: root
    group: root
    mode: "0755"
  when: alloy_docker

- name: Install the container metrics units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - docker-metrics.service
    - docker-metrics.timer
  when: alloy_docker
  notify: Restart docker metrics timer

- name: Enable and start the container metrics timer
  ansible.builtin.systemd:
    name: docker-metrics.timer
    enabled: true
    state: started
    daemon_reload: true
  when: alloy_docker

- name: Install the SMART metrics script
  ansible.builtin.copy:
    src: smart-metrics
    dest: /usr/local/bin/smart-metrics
    owner: root
    group: root
    mode: "0755"
  when: alloy_smart

- name: Install the SMART metrics units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - smart-metrics.service
    - smart-metrics.timer
  when: alloy_smart
  notify: Restart smart metrics timer

- name: Enable and start the SMART metrics timer
  ansible.builtin.systemd:
    name: smart-metrics.timer
    enabled: true
    state: started
    daemon_reload: true
  when: alloy_smart

- name: Create the Alloy unit override directory
  ansible.builtin.file:
    path: /etc/systemd/system/alloy.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: alloy_beyla

- name: Run Alloy as root where Beyla needs eBPF
  ansible.builtin.template:
    src: alloy-root.conf.j2
    dest: /etc/systemd/system/alloy.service.d/root.conf
    owner: root
    group: root
    mode: "0644"
  when: alloy_beyla
  notify: Restart alloy

- name: Remove the root override where Beyla is off
  ansible.builtin.file:
    path: /etc/systemd/system/alloy.service.d/root.conf
    state: absent
  when: not alloy_beyla
  notify: Restart alloy

- name: Name the guests for Beyla's reverse lookups
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} Alloy Beyla peers"
    insertafter: '^127\.0\.0\.1 '
    block: |
      {% for host in alloy_beyla_peers %}
      {{ hostvars[host].ansible_host }} {{ host }}
      {% endfor %}
  when: alloy_beyla
  notify: Restart alloy

- name: Install the Alloy environment
  ansible.builtin.template:
    src: alloy.env.j2
    dest: "{{ alloy_env_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart alloy

- name: Install the Alloy configuration
  ansible.builtin.template:
    src: config.alloy.j2
    dest: "{{ alloy_config }}"
    owner: root
    group: "{{ alloy_user }}"
    mode: "0640"
    validate: /usr/bin/alloy validate %s
  notify: Reload alloy

- name: Enable and start Alloy
  ansible.builtin.systemd:
    name: alloy
    enabled: true
    state: started

- name: Apply pending Alloy restarts
  ansible.builtin.meta: flush_handlers

- name: Wait until Alloy is ready
  ansible.builtin.uri:
    url: "http://{{ alloy_http_listen }}/-/ready"
    status_code: 200
  register: alloy_ready
  retries: 12
  delay: 5
  until: alloy_ready.status == 200
