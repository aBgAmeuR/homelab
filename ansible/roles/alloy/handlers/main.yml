---
- name: Restart alloy
  ansible.builtin.systemd:
    name: alloy
    state: restarted
    daemon_reload: true

- name: Reload alloy
  ansible.builtin.systemd:
    name: alloy
    state: reloaded

- name: Restart docker metrics timer
  ansible.builtin.systemd:
    name: docker-metrics.timer
    state: restarted
    daemon_reload: true

- name: Restart apt metrics timer
  ansible.builtin.systemd:
    name: apt-metrics.timer
    state: restarted
    daemon_reload: true

- name: Restart smart metrics timer
  ansible.builtin.systemd:
    name: smart-metrics.timer
    state: restarted
    daemon_reload: true
