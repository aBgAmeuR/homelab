---
# renovate: datasource=github-releases depName=tinyauthapp/tinyauth
tinyauth_version: "v5.2.0"
tinyauth_download_url: "https://github.com/tinyauthapp/tinyauth/releases/download/{{ tinyauth_version }}/tinyauth-amd64"
tinyauth_checksum: "sha256:a8c3d9e847e275f105bf74791ad9a733f76dcf890038381aeb7ab78ec50fc474"
tinyauth_binary: /usr/local/bin/tinyauth
tinyauth_env_file: /etc/tinyauth.env
tinyauth_data_dir: /var/lib/tinyauth
tinyauth_user: tinyauth
tinyauth_port: 3000
tinyauth_app_url: https://auth.antoinejosset.fr
tinyauth_trusted_proxies: "192.168.1.113"
tinyauth_oidc_clients:
  - env_name: GRAFANA
    client_id: "{{ grafana_oidc_client_id }}"
    client_secret: "{{ grafana_oidc_client_secret }}"
    redirect_uri: https://monitoring.antoinejosset.fr/login/generic_oauth
    display_name: Grafana
  - env_name: FILEBROWSER
    client_id: "{{ filebrowser_oidc_client_id }}"
    client_secret: "{{ filebrowser_oidc_client_secret }}"
    redirect_uri: https://filebrowser.antoinejosset.fr/api/auth/oidc/callback
    display_name: File Browser
  - env_name: PROXMOX
    client_id: "{{ proxmox_oidc_client_id }}"
    client_secret: "{{ proxmox_oidc_client_secret }}"
    redirect_uri: https://proxmox.antoinejosset.fr
    display_name: Proxmox
  - env_name: AFFINE
    client_id: "{{ affine_oidc_client_id }}"
    client_secret: "{{ affine_oidc_client_secret }}"
    redirect_uri: https://docs.antoinejosset.fr/oauth/callback
    display_name: Docs
