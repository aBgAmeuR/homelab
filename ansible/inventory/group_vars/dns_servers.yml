---
blocky_upstreams:
  - 1.1.1.1
  - 1.0.0.1

# HaGeZi Pro, wildcard format.
blocky_denylists:
  - https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/pro.txt

# Domains HaGeZi blocks that must keep working.
blocky_allowlist: []

# Local records. No wildcard on lab_domain: the Harmony hostname must keep
# resolving to Cloudflare. Copied from Pi-hole on 2026-10-16.
blocky_custom_dns:
  - { name: "auth.{{ lab_domain }}", ip: 192.168.1.113 }
  - { name: "caddy.{{ lab_domain }}", ip: 192.168.1.113 }
  - { name: "docs.{{ lab_domain }}", ip: 192.168.1.113 }
  - { name: "files.{{ lab_domain }}", ip: 192.168.1.113 }
  - { name: "monitoring.{{ lab_domain }}", ip: 192.168.1.113 }
  - { name: "proxmox.{{ lab_domain }}", ip: 192.168.1.113 }
  - { name: "garage.{{ lab_domain }}", ip: 192.168.1.112 }

dnsmasq_dhcp_enabled: true
dnsmasq_dhcp_dns_servers:
  - 192.168.1.116
  - 1.1.1.1

alloy_systemd_units:
  - blocky.service
  - dnsmasq.service
alloy_scrape_targets:
  - job: blocky
    address: "127.0.0.1:{{ blocky_http_port | default(4000) }}"
alloy_journal_json_units:
  - unit: blocky.service
    fields:
      - level
      - msg
      - prefix
      - client_ip
      - client_names
      - question_name
      - question_type
      - response_type
      - response_reason
      - response_code
      - duration_ms
      - answer
