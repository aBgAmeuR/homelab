---
- name: Filestash
  hosts: docker
  become: true
  gather_facts: true
  tags: [filestash, docker-host]
  vars:
    compose_project_src: "{{ inventory_dir }}/../../docker/host/filestash"
    compose_project_dest: /opt/filestash
    compose_data_dir: /var/lib/filestash
    compose_data_owners:
      state: "1000"
    compose_templates:
      - src: filestash.env.j2
        dest: filestash.env
        mode: "0600"
    compose_health_url: http://127.0.0.1:8334/healthz
    filestash_config_path: "{{ compose_data_dir }}/state/config/config.json"
  pre_tasks:
    - name: Require the Filestash secrets
      ansible.builtin.assert:
        that:
          - filestash_admin_password_hash is defined
          - filestash_admin_password_hash is match('^\$2[aby]\$')
          - filestash_local_backend_secret is defined
          - filestash_local_backend_secret | length >= 16
        fail_msg: >-
          Set filestash_admin_password_hash (bcrypt) and
          filestash_local_backend_secret in inventory/group_vars/all.sops.yml.

    - name: Look up the filebrowser dataset mount
      ansible.builtin.command:
        cmd: findmnt --mountpoint /mnt/filebrowser --noheadings --output SOURCE
      register: filebrowser_mount
      changed_when: false
      failed_when: false

    - name: The filebrowser dataset must be bind-mounted from the host
      ansible.builtin.fail:
        msg: >-
          /mnt/filebrowser is not a mount of /hdd/filebrowser
          (found: {{ filebrowser_mount.stdout | default('nothing') }}).
          On CT 115 as root@pam, set mp0 to
          /hdd/filebrowser,mp=/mnt/filebrowser.
      when: >-
        filebrowser_mount.rc != 0
        or (
          '/hdd/filebrowser' not in (filebrowser_mount.stdout | default(''))
          and 'hdd[/filebrowser]' not in (filebrowser_mount.stdout | default(''))
        )

    - name: Check that uid 1000 can write the filebrowser dataset
      ansible.builtin.command:
        cmd: setpriv --reuid=1000 --regid=1000 --clear-groups test -w /mnt/filebrowser
      register: filebrowser_dataset_writable
      changed_when: false
      failed_when: false

    - name: The filebrowser dataset must be owned by the unprivileged uid
      ansible.builtin.fail:
        msg: >-
          /mnt/filebrowser is not writable by uid 1000. On the Proxmox host run
          chown 101000:101000 /hdd/filebrowser && chmod 755 /hdd/filebrowser
      when: filebrowser_dataset_writable.rc != 0
  roles:
    - baseline
    - docker
    - compose
  post_tasks:
    # Filestash rewrites config.json on every start, so only the managed keys
    # are compared and merged into what it wrote.
    - name: Read the Filestash config
      ansible.builtin.slurp:
        src: "{{ filestash_config_path }}"
      register: filestash_config_file

    - name: Merge the managed Filestash settings
      ansible.builtin.set_fact:
        filestash_config_current: "{{ filestash_config_file.content | b64decode | from_json }}"
        filestash_config_wanted: >-
          {{ filestash_config_file.content | b64decode | from_json
             | combine(lookup('ansible.builtin.template', 'filestash-config.json.j2', convert_data=False)
                       | from_json,
                       recursive=True) }}
      no_log: true

    - name: Write the Filestash config
      ansible.builtin.copy:
        content: "{{ filestash_config_wanted | to_nice_json(indent=4) }}\n"
        dest: "{{ filestash_config_path }}"
        owner: "1000"
        group: "1000"
        mode: "0600"
      register: filestash_config_write
      when: filestash_config_wanted != filestash_config_current
      no_log: true

    - name: Restart Filestash on the new config
      ansible.builtin.command:
        cmd: docker compose restart filestash
        chdir: "{{ compose_project_dest }}"
      changed_when: true
      when: filestash_config_write is changed

    - name: Wait until Filestash answers again
      ansible.builtin.uri:
        url: "{{ compose_health_url }}"
        status_code: 200
      register: filestash_health
      retries: "{{ compose_health_retries }}"
      delay: "{{ compose_health_delay }}"
      until: filestash_health.status == 200
      when: filestash_config_write is changed

- name: Host exporters
  hosts: docker
  become: true
  gather_facts: true
  tags: [exporters, docker-host]
  vars:
    compose_project_src: "{{ inventory_dir }}/../../docker/host/exporters"
    compose_project_dest: /opt/exporters
    compose_data_dir: ""
    compose_data_owners: {}
    compose_remove_files: []
    compose_templates: []
    compose_health_url: http://127.0.0.1:8080/healthz
  roles:
    - compose

- name: Harmony
  hosts: docker
  become: true
  gather_facts: true
  tags: [harmony, docker-host]
  vars:
    compose_project_src: "{{ inventory_dir }}/../../docker/host/harmony"
    compose_project_dest: /opt/harmony
    compose_data_dir: ""
    compose_data_owners: {}
    compose_remove_files: []
    compose_templates:
      - src: harmony.env.j2
        dest: harmony.env
        mode: "0600"
    compose_health_url: http://127.0.0.1:3000/health
    harmony_project_dir: "{{ compose_project_dest }}"
  pre_tasks:
    - name: Require the Harmony environment
      ansible.builtin.assert:
        that:
          - harmony_env is defined
          - harmony_env | trim | length > 0
          - "'CHANGE_ME' not in harmony_env"
          - "'TUNNEL_TOKEN=' in harmony_env"
        fail_msg: >-
          Set harmony_env in inventory/host_vars/docker.sops.yml to the Harmony
          dotenv, including TUNNEL_TOKEN. Ansible writes it to
          {{ compose_project_dest }}/harmony.env.
  roles:
    - baseline
    - docker
    - compose
    - harmony

- name: AFFiNE
  hosts: docker
  become: true
  gather_facts: true
  tags: [affine, docker-host]
  vars:
    compose_project_src: "{{ inventory_dir }}/../../docker/host/affine"
    compose_project_dest: /opt/affine
    compose_data_dir: /var/lib/affine
    compose_data_owners:
      postgres: "999"
      storage: "0"
    compose_remove_files: []
    compose_templates:
      - src: affine-config.json.j2
        dest: config/config.json
        mode: "0600"
    compose_health_url: http://127.0.0.1:3010/info
    compose_health_retries: 60
  pre_tasks:
    - name: Require the AFFiNE OIDC client pair
      ansible.builtin.assert:
        that:
          - affine_oidc_client_id is defined
          - affine_oidc_client_id | length > 0
          - affine_oidc_client_id != "CHANGE_ME"
          - affine_oidc_client_secret is defined
          - affine_oidc_client_secret | length > 0
          - affine_oidc_client_secret != "CHANGE_ME"
          - affine_admin_password is defined
          - affine_admin_password | length >= 8
          - affine_admin_password | length <= 64
        fail_msg: >-
          Set affine_oidc_client_id, affine_oidc_client_secret and
          affine_admin_password in inventory/group_vars/all.sops.yml.
  roles:
    - baseline
    - docker
    - compose
  post_tasks:
    - name: Create the first AFFiNE admin
      ansible.builtin.uri:
        url: http://127.0.0.1:3010/api/setup/create-admin-user
        method: POST
        body_format: json
        return_content: true
        body:
          name: admin
          email: "affine@{{ lab_domain }}"
          password: "{{ affine_admin_password }}"
        status_code: [200, 403]
      register: affine_setup
      changed_when: affine_setup.status == 200
      failed_when: >-
        affine_setup.status == 403
        and 'First user already created' not in (affine_setup.content | default(''))
