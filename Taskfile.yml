version: "3"

env:
  SOPS_AGE_KEY_FILE:
    sh: printf '%s' "${SOPS_AGE_KEY_FILE:-$HOME/.config/sops/age/keys.txt}"

tasks:
  default:
    silent: true
    cmds:
      - task --list

  tf:init:
    desc: terraform init
    cmds:
      - task: tf
        vars: { CMD: init }

  tf:plan:
    desc: terraform plan (extra flags after --)
    cmds:
      - task: tf
        vars: { CMD: plan }

  tf:apply:
    desc: terraform apply (extra flags after --)
    cmds:
      - task: tf
        vars: { CMD: apply }

  ansible:
    desc: ansible-playbook (playbook and flags after --)
    dir: ansible
    cmds:
      - ansible-playbook {{.CLI_ARGS}}

  wg:peer:
    desc: new WireGuard client (name and tunnel address after --, WG_ENDPOINT=host:port)
    cmds:
      - scripts/wg-peer.sh {{.CLI_ARGS}}

  check:
    desc: terraform fmt and validate, ansible syntax check
    cmds:
      - terraform -chdir=terraform fmt -recursive -check
      - task: tf
        vars: { CMD: validate }
      - task: ansible
        vars: { CLI_ARGS: --syntax-check playbooks/site.yml }

  check:alerting:
    desc: promtool and amtool checks of the Prometheus config, rules and rule tests, and the Alertmanager config
    cmds:
      - promtool check config --syntax-only docker/monitoring/prometheus.yml
      - promtool check rules docker/monitoring/rules/*.yml
      - promtool test rules tests/prometheus/*.test.yml
      - amtool check-config docker/monitoring/alertmanager.yml

  tf:
    internal: true
    silent: true
    dir: terraform
    vars:
      SECRETS: "{{.TASKFILE_DIR}}/ansible/inventory/group_vars/garage_servers.sops.yml"
    env:
      AWS_DEFAULT_REGION: garage
      AWS_EC2_METADATA_DISABLED: "true"
    cmds:
      - |
        export AWS_ACCESS_KEY_ID="$(sops -d --extract '["garage_s3_access_key"]' {{.SECRETS}})"
        export AWS_SECRET_ACCESS_KEY="$(sops -d --extract '["garage_s3_secret_key"]' {{.SECRETS}})"
        export TF_VAR_proxmox_api_token="$(sops -d --extract '["proxmox_api_token"]' secrets.sops.yaml)"
        terraform {{.CMD}} {{.CLI_ARGS}}
