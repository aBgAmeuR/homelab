version: "3"

env:
  SOPS_AGE_KEY_FILE:
    sh: printf '%s' "${SOPS_AGE_KEY_FILE:-$HOME/.config/sops/age/keys.txt}"
  PATH:
    sh: printf '%s:%s' "$HOME/.local/bin" "$PATH"

tasks:
  default:
    silent: true
    cmds:
      - task --list

  tf-secrets:
    silent: true
    desc: "Decrypt Terraform secrets into .env"
    dir: terraform
    cmds:
      - |
        printf '%s\n' \
          "AWS_ACCESS_KEY_ID=$(sops -d --extract '["garage_s3_access_key"]' {{.TASKFILE_DIR}}/ansible/inventory/group_vars/garage_servers.sops.yml)" \
          "AWS_SECRET_ACCESS_KEY=$(sops -d --extract '["garage_s3_secret_key"]' {{.TASKFILE_DIR}}/ansible/inventory/group_vars/garage_servers.sops.yml)" \
          "AWS_DEFAULT_REGION=garage" \
          "AWS_EC2_METADATA_DISABLED=true" \
          "TF_VAR_proxmox_api_token=$(sops -d --extract '["proxmox_api_token"]' secrets.sops.yaml)" \
          > .env

  tf-init:
    desc: "terraform init"
    dir: terraform
    deps: [tf-secrets]
    dotenv: [.env]
    cmds:
      - terraform init

  tf-plan:
    desc: "terraform plan"
    dir: terraform
    deps: [tf-secrets]
    dotenv: [.env]
    cmds:
      - terraform plan

  tf-apply:
    desc: "terraform apply"
    dir: terraform
    deps: [tf-secrets]
    dotenv: [.env]
    cmds:
      - terraform apply

  ansible:
    desc: "ansible-playbook ..."
    dir: ansible
    cmds:
      - ansible-playbook {{.CLI_ARGS}}

  check:
    desc: "Format Terraform and syntax-check the playbooks"
    deps: [tf-secrets]
    dotenv: [terraform/.env]
    cmds:
      - terraform -chdir=terraform fmt -recursive -check
      - terraform -chdir=terraform validate
      - task: ansible
        vars:
          CLI_ARGS: --syntax-check playbooks/site.yml
