name: exporters

services:
  cadvisor:
    restart: unless-stopped
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    ports:
      - "127.0.0.1:8080:8080"
