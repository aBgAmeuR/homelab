name: filestash

services:
  filestash:
    restart: unless-stopped
    image: machines/filestash:latest@sha256:935cc2faa3498ac0137a0c3374685be26b9657eb6faccdcd68f665bdbf4ff066
    user: "1000:1000"
    env_file:
      - filestash.env
    environment:
      # Keep the IdP and mapping params in clear text so Ansible can compare them.
      CONFIG_ENCRYPT: "false"
    volumes:
      - /var/lib/filestash/state:/app/data/state
      - /mnt/filebrowser:/srv
    ports:
      - "0.0.0.0:8334:8334"
