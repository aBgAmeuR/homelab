name: filestash

services:
  filestash:
    restart: unless-stopped
    image: machines/filestash:latest@sha256:c5e903af92e25fd53f69093fa6f6420c5232307c02c2e0b35b1066e1f36613c1
    user: "1000:1000"
    env_file:
      - filestash.env
    environment:
      # Keep the IdP and mapping params in clear text so Ansible can compare them.
      CONFIG_ENCRYPT: "false"
    volumes:
      - /var/lib/filestash/state:/app/data/state
      - /mnt/filebrowser:/srv
    ports:
      - "0.0.0.0:8334:8334"
