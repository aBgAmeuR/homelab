name: filestash

services:
  filestash:
    restart: unless-stopped
    image: machines/filestash:latest@sha256:8335b641238350f603585d17b1922adcdc0fd8e73da18fb4f3d59f98d32294c0
    user: "1000:1000"
    env_file:
      - filestash.env
    environment:
      # Keep the IdP and mapping params in clear text so Ansible can compare them.
      CONFIG_ENCRYPT: "false"
    volumes:
      - /var/lib/filestash/state:/app/data/state
      - /mnt/filebrowser:/srv
    ports:
      - "0.0.0.0:8334:8334"
