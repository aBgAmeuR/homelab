name: filestash

services:
  filestash:
    restart: unless-stopped
    image: machines/filestash:latest@sha256:8637c27716a201cfec943f5d7f5dbb6f3bcdd7c412381f5e36171ac9d950470c
    user: "1000:1000"
    env_file:
      - filestash.env
    environment:
      # Keep the IdP and mapping params in clear text so Ansible can compare them.
      CONFIG_ENCRYPT: "false"
    volumes:
      - /var/lib/filestash/state:/app/data/state
      - /mnt/filebrowser:/srv
    ports:
      - "0.0.0.0:8334:8334"
