name: filestash

services:
  filestash:
    restart: unless-stopped
    image: machines/filestash:latest@sha256:38f64d531c56c7b5b9701492d8eeba39cbc355773d293381e6b022f3a1faaee2
    user: "1000:1000"
    env_file:
      - filestash.env
    environment:
      # Keep the IdP and mapping params in clear text so Ansible can compare them.
      CONFIG_ENCRYPT: "false"
    volumes:
      - /var/lib/filestash/state:/app/data/state
      - /mnt/filebrowser:/srv
    ports:
      - "0.0.0.0:8334:8334"
