name: filestash

services:
  filestash:
    restart: unless-stopped
    image: machines/filestash:latest@sha256:c471bd6c398794501cddf06b8f8caf42371e61e3bedb9709d360eb5150997839
    user: "1000:1000"
    env_file:
      - filestash.env
    environment:
      # Keep the IdP and mapping params in clear text so Ansible can compare them.
      CONFIG_ENCRYPT: "false"
    volumes:
      - /var/lib/filestash/state:/app/data/state
      - /mnt/filebrowser:/srv
    ports:
      - "0.0.0.0:8334:8334"
