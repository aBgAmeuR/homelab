global:
  scrape_interval: 30s
  evaluation_interval: 30s

storage:
  tsdb:
    out_of_order_time_window: 30m

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: lgtm
    static_configs:
      - targets:
          - loki:3100
          - tempo:3200
          - pyroscope:4040
          - otel-collector:8888
          - blackbox-exporter:9115
          - alertmanager:9093

  - job_name: pve
    metrics_path: /pve
    params:
      module: ["default"]
      cluster: ["1"]
      node: ["1"]
    static_configs:
      - targets: ["192.168.1.110"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: pve-exporter:9221
    metric_relabel_configs:
      - source_labels: [id]
        regex: (lxc|qemu)/(\d+)
        target_label: vmid
        replacement: $2

  - job_name: probe_icmp
    metrics_path: /probe
    params:
      module: [icmp]
    file_sd_configs:
      - files: [/etc/prometheus/targets/probes-icmp.yml]
    relabel_configs: &probe_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: target
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: probe_http
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files: [/etc/prometheus/targets/probes-http.yml]
    relabel_configs: *probe_relabel

  - job_name: probe_dns
    metrics_path: /probe
    params:
      module: [dns_lab]
    file_sd_configs:
      - files: [/etc/prometheus/targets/probes-dns.yml]
    relabel_configs: *probe_relabel
