global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/nodes.yml

  - job_name: lgtm
    static_configs:
      - targets:
          - loki:3100
          - tempo:3200
          - pyroscope:4040
          - otel-collector:8888

  - job_name: cadvisor
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/cadvisor.yml

  - job_name: pve
    metrics_path: /pve
    params:
      module: ["default"]
      cluster: ["1"]
      node: ["1"]
    static_configs:
      - targets: ["192.168.1.40"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: pve-exporter:9221
