route:
  receiver: none
  group_by: [alertname, vmid]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 24h

receivers:
  - name: none

inhibit_rules:
  - source_matchers:
      - alertname = GuestDown
    target_matchers:
      - alertname != GuestDown
    equal: [vmid]

  - source_matchers:
      - severity = critical
    target_matchers:
      - severity = warning
    equal: [alertname, instance, vmid, id, mountpoint, device, site, chip, sensor]
