name: monitoring

services:
  grafana:
    restart: unless-stopped
    image: grafana/grafana:13.3.0
    user: "472"
    env_file:
      - grafana.env
    environment:
      GF_SERVER_ROOT_URL: https://monitoring.antoinejosset.fr
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - /var/lib/monitoring/grafana:/var/lib/grafana
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards/homelab:ro
    ports:
      - "0.0.0.0:3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
      - pyroscope

  prometheus:
    restart: unless-stopped
    image: prom/prometheus:v3.14.0
    user: "65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --web.enable-otlp-receiver
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules:/etc/prometheus/rules:ro
      - ./targets:/etc/prometheus/targets:ro
      - /var/lib/monitoring/prometheus:/prometheus
    ports:
      - "192.168.1.111:9090:9090"

  alertmanager:
    restart: unless-stopped
    image: prom/alertmanager:v0.34.2
    user: "65534"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - /var/lib/monitoring/alertmanager:/alertmanager

  loki:
    restart: unless-stopped
    image: grafana/loki:3.7.7
    user: "10001"
    command:
      - -config.file=/etc/loki/config.yml
    volumes:
      - ./loki.yml:/etc/loki/config.yml:ro
      - /var/lib/monitoring/loki:/loki
    ports:
      - "192.168.1.111:3100:3100"

  tempo:
    restart: unless-stopped
    image: grafana/tempo:2.10.8
    user: "10001"
    command:
      - -config.file=/etc/tempo/config.yml
    volumes:
      - ./tempo.yml:/etc/tempo/config.yml:ro
      - /var/lib/monitoring/tempo:/var/tempo

  pyroscope:
    restart: unless-stopped
    image: grafana/pyroscope:2.3.0
    user: "10001"
    command:
      - -config.file=/etc/pyroscope/config.yml
      - -retention-period=14d
    volumes:
      - ./pyroscope.yml:/etc/pyroscope/config.yml:ro
      - /var/lib/monitoring/pyroscope:/data

  otel-collector:
    restart: unless-stopped
    image: otel/opentelemetry-collector-contrib:0.160.0
    command:
      - --config=/etc/otelcol/config.yml
    volumes:
      - ./otelcol.yml:/etc/otelcol/config.yml:ro
    ports:
      - "192.168.1.111:4317:4317"
      - "192.168.1.111:4318:4318"
    depends_on:
      - prometheus
      - loki
      - tempo

  cadvisor:
    restart: unless-stopped
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    ports:
      - "127.0.0.1:8080:8080"

  pve-exporter:
    restart: unless-stopped
    image: prompve/prometheus-pve-exporter:3.10.0
    volumes:
      - ./pve-exporter.yml:/etc/prometheus/pve.yml:ro

  blackbox-exporter:
    restart: unless-stopped
    image: prom/blackbox-exporter:v0.29.1
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./blackbox.yml:/etc/blackbox/blackbox.yml:ro
